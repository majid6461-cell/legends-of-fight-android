name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Export Godot Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_VERSION_DIR: '4.7.2.stable'
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
      ANDROID_SDK_ROOT: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Restore Godot project source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lof-source
          cat source/chunk-*.b64 | base64 --decode > /tmp/lof-source.tar.xz
          echo "c641f984599d8411afcc649289ced7901e79831805cde962ceb16fcffe1cd23c  /tmp/lof-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/lof-source.tar.xz -C /tmp/lof-source
          cp -a /tmp/lof-source/legends-of-fight-android/. ./
          grep -q '^textures/vram_compression/import_etc2_astc=' project.godot || \
            sed -i '/^renderer\/rendering_method.mobile=/a textures/vram_compression/import_etc2_astc=true' project.godot
          sed -i 's/var x := side \* (4.8 + float(i) \* 0.7)/var x: float = float(side) * (4.8 + float(i) * 0.7)/' scripts/main.gd
          sed -i 's/var chance := \[0.22, 0.42, 0.62\]\[difficulty_index\]/var chance: float = float([0.22, 0.42, 0.62][difficulty_index])/' scripts/main.gd
          grep -q '^const MainScript = preload' tests/smoke_test.gd || \
            sed -i '/^const Roster = /a const MainScript = preload("res://scripts/main.gd")' tests/smoke_test.gd
          sed -i 's/^architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'
          sdkmanager --licenses

      - name: Download Godot editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-editor /tmp/godot-template-unpack "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"
          unzip -q /tmp/godot.zip -d /tmp/godot-editor
          sudo install "/tmp/godot-editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-template-unpack
          if [ -d /tmp/godot-template-unpack/templates ]; then
            cp -a /tmp/godot-template-unpack/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/"
          else
            cp -a /tmp/godot-template-unpack/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/"
          fi
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}/android_debug.apk"
          godot --version

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate Godot project
        run: |
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -q 'SCRIPT ERROR:' /tmp/godot-import.log; then
            cat /tmp/godot-import.log
            exit 1
          fi
          godot --headless --path . --script res://tests/smoke_test.gd

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug 'Android' build/LegendsOfFight.apk
          test -s build/LegendsOfFight.apk

      - name: Verify APK package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/LegendsOfFight.apk | head -n 5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendsOfFight-Android-${{ github.sha }}
          path: build/LegendsOfFight.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Legends of Fight ${{ github.ref_name }}
          files: build/LegendsOfFight.apk
          generate_release_notes: true

  emulator-smoke-test:
    name: Install and launch on Android emulator
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LegendsOfFight-Android-${{ github.sha }}
          path: build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb install -r build/LegendsOfFight.apk
            adb logcat -c
            adb shell monkey -p com.legends.fight -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d -s AndroidRuntime:E > /tmp/android-runtime.log
            if grep -q 'FATAL EXCEPTION' /tmp/android-runtime.log; then
              cat /tmp/android-runtime.log
              exit 1
            fi
            adb shell pidof com.legends.fight
            echo 'PASS: APK installed and app process remained alive on Android emulator'
